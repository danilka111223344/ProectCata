<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <meta charset="UTF-8">
    <title>Admin panel</title>

    <style>
        #deleteUserRole option:checked {
            background-color: #e9ecef;
            color: #000;
        }
    </style>

    <style>
        .btn-outline-secondary-white {
            border: 1px solid transparent !important;
            outline: none !important;
            box-shadow: none !important;
        }

        .btn-outline-secondary-white:not(.active):hover {
            background-color: transparent !important;
            color: #0d6efd !important;
            border: 1px solid #dee2e6 !important;
            border-radius: 5px 5px 0 0 !important;
            outline: none !important;
            box-shadow: none !important;
        }

        .btn-outline-secondary-white.active,
        .btn-outline-secondary-white:active {
            background-color: white !important;
            color: black !important;
            border: 1px solid #dee2e6 !important;
            border-radius: 5px 5px 0 0 !important;
            outline: none !important;
            box-shadow: none !important;
        }
    </style>

    <style>
        .btn-logout {
            background-color: #212529;
            color: #6c757d;
            border: none;
        }
        .btn-logout:hover {
            color: white;
            background-color: #212529;
        }
    </style>

    <style>
        .btn-danger:active {
            border-color: #ff3333;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
        }
    </style>

    <style>
        .special-btn:active {
            border-color: #86b7fe;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
    </style>

    <style>
        .special-close-btn:active {
            border-color: #6c757d;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(108, 117, 125, 0.25);
        }
    </style>


</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <span th:text="${currentUser.username}" class="fw-bold"></span>
                <span class="fw-normal">with roles:</span>
                 <span th:each="role, iterStat : ${currentUser.roles}">
                    <span th:text="${role.name.replace('ROLE_','')}" class="fw-normal"></span>
                    <span th:if="${!iterStat.last}" class="fw-normal"> </span>
                </span>
            </span>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn-logout" type="submit">Logout</button>
        </form>
    </div>
</nav>

<div class="d-flex">
    <div class="bg-white text-blue" style="width: 260px; min-height: 100vh; margin-top: 16px">
        <div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link btn btn-primary active text-white text-start" href="/admin">
                        Admin
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-primary bg-white text-blue text-start " href="/user">
                        User
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="flex-grow-1 p-4 bg-light">
        <h1 style="margin-left: 20px">Admin panel</h1>

        <ul class="nav" style="margin-left: 20px">
            <li class="nav-item">
                <a href="/admin" class="nav-link btn btn-outline-secondary-white active border m-0" aria-current="page">Users
                    table</a>
            </li>
            <li class="nav-item">
                <a href="/admin/new" class="nav-link btn btn-outline-secondary-white ">New User</a>
            </li>
        </ul>

        <div class="bg-light border p-2 rounded-top"
             style="padding-left: 20px !important; padding-right: 20px !important; margin-left: 20px; margin-right: 20px">
            <h5>All users</h5>
        </div>
        <div class="bg-white rounded-bottom"
             style="border: 1px solid #dee2e6; padding-left: 20px; padding-right: 20px; padding-bottom: 30px; padding-top: 20px; margin-left: 20px; margin-right: 20px">
            <table class="table table-borderless">
                <thead>
                <tr class="border-top">
                    <th scope="col" style="width: 5%">ID</th>
                    <th scope="col" style="width: 10%">First Name</th>
                    <th scope="col" style="width: 10%">Last Name</th>
                    <th scope="col" style="width: 5%">Age</th>
                    <th scope="col" style="width: 15%;">Email</th>
                    <th scope="col" style="width: 15%">Role</th>
                    <th scope="col" style="width: 5%">Edit</th>
                    <th scope="col" style="width: 5%">Delete</th>
                </tr>
                </thead>
                <tbody id="usersBody">

                </tbody>
            </table>
        </div>

        <div class="modal fade" id="editModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit user</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form id="editForm">
                        <div class="modal-body text-center">
                            <input type="hidden" name="id" id="editUserId">

                            <div class="mb-3">
                                <label class="form-label d-block fw-bold mb-0">ID</label>
                                <input type="text" id="editUserIdDisplay"
                                       style="width: 200px; height: 40px; padding-left: 5px"  disabled>
                            </div>

                            <div class="mb-3">
                                <label  class="form-label d-block fw-bold mb-0">First Name</label>
                                <input type="text" name="name" id="editName"
                                       style="width: 200px; height: 40px; padding-left: 5px" class="form-control mx-auto">
                            </div>
                            <div class="mb-3">
                                <label class="form-label d-block fw-bold mb-0">Last Name</label>
                                <input type="text" id="editLastName" name="lastName"
                                       style="width: 200px; height: 40px; padding-left: 5px" class="form-control mx-auto">
                            </div>
                            <div class="mb-3">
                                <label  class="form-label d-block fw-bold mb-0">Age</label>
                                <input type="number" id="editAge" name="age"
                                       style="width: 200px; height: 40px; padding-left: 5px" class="form-control mx-auto">
                            </div>
                            <div class="mb-3">
                                <label class="form-label d-block fw-bold mb-0">Email</label>
                                <input type="email" name="username" id="editUsername"
                                       style="width: 200px; height: 40px; padding-left: 5px" class="form-control mx-auto">
                            </div>
                            <div class="mb-3">
                                <label class="form-label d-block fw-bold mb-0">Password</label>
                                <input type="password" name="password" id="editPassword"
                                       style="width: 200px; height: 40px; padding-left: 5px" class="form-control mx-auto">
                            </div>
                            <div class="mb-3">
                                <label class="form-label d-block fw-bold mb-0">Role</label>
                                <select name="rolename" multiple id="editRoles"
                                        style="width: 200px; height: 45px; padding-left: 5px" class="form-control mx-auto">

                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary special-close-btn " data-bs-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary special-btn" id="editUserBtn">Edit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <div class="mb-3">
                    <label class="form-label d-block fw-bold mb-0">ID</label>
                    <input type="text" id="deleteUserId" style="width: 200px; height: 40px; padding-left: 5px"
                           class="bg-light" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label d-block fw-bold mb-0">First Name</label>
                    <input type="text" id="deleteUserName" style="width: 200px; height: 40px; padding-left: 5px"
                           class="bg-light" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label d-block fw-bold mb-0">Last name</label>
                    <input type="text" id="deleteUserLastName" style="width: 200px; height: 40px; padding-left: 5px"
                           class="bg-light" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label d-block fw-bold mb-0">Age</label>
                    <input type="text" id="deleteUserAge" style="width: 200px; height: 40px; padding-left: 5px"
                           class="bg-light" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label d-block fw-bold mb-0">Email</label>
                    <input type="email" id="deleteUserUsername" style="width: 200px; height: 40px; padding-left: 5px"
                           class="bg-light" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label d-block fw-bold mb-0">Role</label>
                    <select multiple id="deleteUserRole" style="width: 200px; height: 45px; padding-left: 5px"
                            class="bg-light" disabled>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary special-close-btn" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-danger" id="deleteBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script  th:inline="javascript">
    const currentUser = /*[[${currentUser}]]*/ null;
    let currentUserId = null;
    let allRoles = [];

    function loadRoles() {
        fetch('/api/roles')
            .then(response => response.json())
            .then(roles => {
                allRoles = roles;
                $('select[name="rolename"]').each(function() {
                    const $select = $(this);
                    $select.empty();
                    roles.forEach(role => {
                         $select.append(`<option value="${role.name}">${role.name.replace('ROLE_', '')}</option>`);
                    });
                });
            });
    }

    function loadUsers() {
        fetch('/api/users')
        .then(response => response.json())
        .then (users => {
            const $tbody = $('#usersBody');
            $tbody.empty();
            users.forEach(user => {
                const roles = user.roles.map(r => r.name.replace('ROLE_', '')).join(', ');
                const isCurrentUser = currentUser && user.username === currentUser.username;
                $tbody.append(`
                    <tr class="${isCurrentUser ? 'table-secondary' : ''} border-top">
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.lastName}</td>
                        <td>${user.age}</td>
                        <td>${user.username}</td>
                        <td>${roles}</td>
                        <td>
                             <button type="button" class="btn btn-info text-white special-btn" onclick="editUser(${user.id})">
                                 Edit
                             </button>
                         </td>
                         <td>
                             <button type="button" class="btn btn-danger" onclick="showDeleteModal(${user.id}, '${user.name}')">
                                 Delete
                             </button>
                         </td>
                         </tr>
                `);
            });
        });
    }

    function editUser(id) {
    fetch('/api/users/' + id)
        .then(response => response.json())
        .then(user => {
            $('#editUserId').val(user.id);
            $('#editUserIdDisplay').val(user.id);
            $('#editName').val(user.name);
            $('#editLastName').val(user.lastName);
            $('#editAge').val(user.age);
            $('#editUsername').val(user.username);
            $('#editPassword').val('');

            const $select = $('#editRoles');
            $select.find('option').prop('selected', false);

            currentUserId = user.id;
            new bootstrap.Modal(document.getElementById('editModal')).show();
        })
    }

    $('#editUserBtn').click(function() {
        const data = {
            name: $('#editName').val(),
            lastName: $('#editLastName').val(),
            age: parseInt($('#editAge').val()) || 0,
            username: $('#editUsername').val(),
            password: $('#editPassword').val() || null,
            roles: ($('#editRoles').val() || [])
        };

        fetch('/api/users/' + currentUserId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(() => {
            bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
            loadUsers();
        });
    });

    function showDeleteModal(id) {
    fetch('/api/users/' + id)
        .then(response => response.json())
        .then(user => {
            document.getElementById('deleteUserId').value = user.id;
            document.getElementById('deleteUserName').value = user.name;
            document.getElementById('deleteUserLastName').value = user.lastName;
            document.getElementById('deleteUserAge').value = user.age;
            document.getElementById('deleteUserUsername').value = user.username;

            const select = document.getElementById('deleteUserRole');
            select.innerHTML = '';
            if (user.roles && user.roles.length > 0) {
                user.roles.forEach(role => {
                    const option = document.createElement('option');
                    option.value = role.name;
                    option.text = role.name.replace('ROLE_', '');
                    option.selected = false;
                    select.appendChild(option);
                });
            }
            new bootstrap.Modal(document.getElementById('deleteModal')).show();
        });
    }

    $('#deleteBtn').click(function() {
        const id = $('#deleteUserId').val();
        fetch('/api/users/' + id, { method: 'DELETE' })
            .then(() => {
                bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
                loadUsers();
            });
    });

    $(document).ready(function() {
    loadRoles();
    loadUsers();
});

</script>

</body>
</html>
