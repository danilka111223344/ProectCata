<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <meta charset="UTF-8">
    <title>Admin panel</title>

    <style>
        #deleteUserRole option:checked {
            background-color: #e9ecef;
            color: #000;
        }
    </style>

    <style>
        .btn-outline-secondary-white {
            border: 1px solid transparent !important;
            outline: none !important;
            box-shadow: none !important;
        }

        .btn-outline-secondary-white:not(.active):hover {
            background-color: transparent !important;
            color: #0d6efd !important;
            border: 1px solid #dee2e6 !important;
            border-radius: 5px 5px 0 0 !important;
            outline: none !important;
            box-shadow: none !important;
        }

        .btn-outline-secondary-white.active,
        .btn-outline-secondary-white:active {
            background-color: white !important;
            color: black !important;
            border: 1px solid #dee2e6 !important;
            border-radius: 5px 5px 0 0 !important;
            outline: none !important;
            box-shadow: none !important;
        }
    </style>

    <style>
        .btn-logout {
            background-color: #212529;
            color: #6c757d;
            border: none;
        }
        .btn-logout:hover {
            color: white;
            background-color: #212529;
        }
    </style>

    <style>
        .btn-danger:active {
            border-color: #ff3333;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
        }
    </style>

    <style>
        .special-btn:active {
            border-color: #86b7fe;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
    </style>

    <style>
        .special-close-btn:active {
            border-color: #6c757d;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(108, 117, 125, 0.25);
        }
    </style>


</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <span th:text="${currentUser.username}" class="fw-bold"></span>
                <span class="fw-normal">with roles:</span>
                 <span th:each="role, iterStat : ${currentUser.roles}">
                    <span th:text="${role.name.replace('ROLE_','')}" class="fw-normal"></span>
                    <span th:if="${!iterStat.last}" class="fw-normal"> </span>
                </span>
            </span>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn-logout" type="submit">Logout</button>
        </form>
    </div>
</nav>

<div class="d-flex">
    <div class="bg-white text-blue" style="width: 260px; min-height: 100vh; margin-top: 16px">
        <div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link btn btn-primary active text-white text-start" href="/admin">
                        Admin
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-primary bg-white text-blue text-start " href="/user">
                        User
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="flex-grow-1 p-4 bg-light">
        <h1 style="margin-left: 20px">Admin panel</h1>

        <ul class="nav" style="margin-left: 20px">
            <li class="nav-item">
                <a href="/admin" class="nav-link btn btn-outline-secondary-white active border m-0" aria-current="page">Users
                    table</a>
            </li>
            <li class="nav-item">
                <a href="/admin/new" class="nav-link btn btn-outline-secondary-white ">New User</a>
            </li>
        </ul>

        <div class="bg-light border p-2 rounded-top"
             style="padding-left: 20px !important; padding-right: 20px !important; margin-left: 20px; margin-right: 20px">
            <h5>All users</h5>
        </div>
        <div class="bg-white rounded-bottom"
             style="border: 1px solid #dee2e6; padding-left: 20px; padding-right: 20px; padding-bottom: 30px; padding-top: 20px; margin-left: 20px; margin-right: 20px">
            <table class="table table-borderless">
                <thead>
                <tr class="border-top">
                    <th scope="col" style="width: 5%">ID</th>
                    <th scope="col" style="width: 10%">First Name</th>
                    <th scope="col" style="width: 10%">Last Name</th>
                    <th scope="col" style="width: 5%">Age</th>
                    <th scope="col" style="width: 15%;">Email</th>
                    <th scope="col" style="width: 15%">Role</th>
                    <th scope="col" style="width: 5%">Edit</th>
                    <th scope="col" style="width: 5%">Delete</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user: ${requestusers}"
                    th:classappend="${user.username == currentUser.username} ? 'table-secondary' : ''"
                    class="border-top">
                    <td th:text="${user.id}"/>
                    <td th:text="${user.name}"/>
                    <td th:text="${user.lastName}"/>
                    <td th:text="${user.age}"/>
                    <td th:text="${user.username}"/>
                    <td>
                <span th:each="role, iterStat : ${user.roles}">
                <span th:text="${role.name.replace('ROLE_','')}"></span>
                <span th:if="${!iterStat.last}">, </span>
                </span>
                    </td>
                    <td>
                        <button type="button" class="btn btn-info text-white special-btn"
                                th:onclick="'new bootstrap.Modal(document.getElementById(\'editModal' + ${user.id} + '\')).show()'">
                        Edit
                        </button>
                    </td>
                    <td>
                        <button type="button" class="btn btn-danger"
                                th:onclick="'new bootstrap.Modal(document.getElementById(\'deleteModal' + ${user.id} + '\')).show()'">
                        Delete
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:each="user : ${requestusers}">
            <div class="modal fade" th:id="'editModal' + ${user.id}" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Edit user</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <form th:method="POST" th:action="@{/admin/change}">
                            <div class="modal-body text-center">
                                <input type="hidden" name="id" th:value="${user.id}">

                                <div class="mb-3">
                                    <label class="form-label d-block fw-bold mb-0">ID</label>
                                    <input type="text" th:value="${user.id}"
                                           style="width: 200px; height: 40px; padding-left: 5px" readonly>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label d-block fw-bold mb-0">First Name</label>
                                    <input type="text" name="name" th:value="${user.name}"
                                           style="width: 200px; height: 40px; padding-left: 5px"
                                           class="form-control mx-auto">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label d-block fw-bold mb-0">Last Name</label>
                                    <input type="text" name="lastName" th:value="${user.lastName}"
                                           style="width: 200px; height: 40px; padding-left: 5px"
                                           class="form-control mx-auto">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label d-block fw-bold mb-0">Age</label>
                                    <input type="number" name="age" th:value="${user.age}"
                                           style="width: 200px; height: 40px; padding-left: 5px"
                                           class="form-control mx-auto">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label d-block fw-bold mb-0">Email</label>
                                    <input type="email" name="username" th:value="${user.username}"
                                           style="width: 200px; height: 40px; padding-left: 5px"
                                           class="form-control mx-auto">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label d-block fw-bold mb-0">Password</label>
                                    <input type="password" name="password"
                                           style="width: 200px; height: 40px; padding-left: 5px"
                                           class="form-control mx-auto">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label d-block fw-bold mb-0">Role</label>
                                    <select name="rolename" multiple
                                            style="width: 200px; height: 45px; padding-left: 5px"
                                            class="form-control mx-auto">
                                        <option th:each="role : ${allRoles}"
                                                th:value="${role.name}"
                                                th:text="${role.name.replace('ROLE_', '')}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary special-close-btn "
                                        data-bs-dismiss="modal">Close
                                </button>
                                <button type="submit" class="btn btn-primary special-btn">Edit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>


            <div class="modal fade" th:id="'deleteModal' + ${user.id}" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Delete user</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body text-center">
                            <div class="mb-3">
                                <label class="form-label d-block fw-bold mb-0">ID</label>
                                <input type="text" name="id" th:value="${user.id}" style="width: 200px; height: 40px; padding-left: 5px"
                                       class="bg-light" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label d-block fw-bold mb-0">First Name</label>
                                <input type="text" name="name" th:value="${user.name}" style="width: 200px; height: 40px; padding-left: 5px"
                                       class="bg-light" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label d-block fw-bold mb-0">Last name</label>
                                <input type="text" name="lastName" th:value="${user.lastName}" style="width: 200px; height: 40px; padding-left: 5px"
                                       class="bg-light" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label d-block fw-bold mb-0">Age</label>
                                <input type="text" name="age" th:value="${user.age}" style="width: 200px; height: 40px; padding-left: 5px"
                                       class="bg-light" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label d-block fw-bold mb-0">Email</label>
                                <input type="email" name="username" th:value="${user.username}" style="width: 200px; height: 40px; padding-left: 5px"
                                       class="bg-light" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label d-block fw-bold mb-0">Role</label>
                                <select multiple name="rolename" style="width: 200px; height: 45px; padding-left: 5px"
                                        class="bg-light" required>
                                    <option th:each="role : ${allRoles}"
                                            th:value="${role.name}"
                                            th:text="${role.name.replace('ROLE_', '')}">
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary special-close-btn" data-bs-dismiss="modal">
                                Close
                            </button>
                            <form th:method="POST" th:action="@{/admin/delete}">
                                <input type="hidden" name="id" th:value="${user.id}">
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
