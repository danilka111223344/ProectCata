<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:if="${errorMessage}" class="global-error" th:text="${errorMessage}"></div>
<form th:method="POST" th:action="@{/admin/new}" th:object="${newuser}">
    <label for="name">Enter name: </label>
    <input type="text" th:field="*{name}" id="name">
    <label for="lastname">Enter lastname: </label>
    <input type="text" th:field="*{lastName}" id="lastname">
    <label for="email">Enter email: </label>
    <input type="email" th:field="*{email}" id="email">
    <label for="age">Enter age: </label>
    <input type="number" th:field="*{age}" id="age">
    <br>

    <label for="phonenumber">Enter phonenumber: </label>
    <input type="tel" th:field="*{phonenumber}" id="phonenumber">
    <label for="username">Enter username: </label>
    <input type="text" th:field="*{username}" id="username">
    <label for="password">Enter password: </label>
    <input type="text" th:field="*{password}" id="password">
    <label>Role: </label>
    <select name="rolename" multiple>
        <option th:each="role : ${allRoles}"
                th:value="${role.name}"
                th:text="${role.name.replace('ROLE_', '')}">
        </option>
    </select>
    <br/>
    <input type="submit" value="Create"/>
</form>
<br/>
<form th:action="@{/logout}" method="post">
    <button type="submit">Выйти</button>
</form>
</body>
</html>
