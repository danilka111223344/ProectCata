<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <meta charset="UTF-8">
    <title>Admin panel</title>

    <style>
        .btn-outline-secondary-white {
            border: 1px solid transparent !important;
            outline: none !important;
            box-shadow: none !important;
        }

        .btn-outline-secondary-white:not(.active):hover {
            background-color: transparent !important;
            color: #0d6efd !important;
            border: 1px solid #dee2e6 !important;
            border-radius: 5px 5px 0 0 !important;
            outline: none !important;
            box-shadow: none !important;
        }

        .btn-outline-secondary-white.active,
        .btn-outline-secondary-white:active {
            background-color: white !important;
            color: black !important;
            border: 1px solid #dee2e6 !important;
            border-radius: 5px 5px 0 0 !important;
            outline: none !important;
            box-shadow: none !important;
        }
    </style>

    <style>
        .btn-logout {
            background-color: #212529;
            color: #6c757d;
            border: none;
        }
            .btn-logout:hover {
                color: white;
                background-color: #212529;
            }
    </style>

    <style>
        .special-add-btn:active {
            border-color: #198754;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <span th:text="${user.username}" class="fw-bold"></span>
                <span class="fw-normal">with roles:</span>
                 <span th:each="role, iterStat : ${user.roles}">
                    <span th:text="${role.name.replace('ROLE_','')}" class="fw-normal"></span>
                    <span th:if="${!iterStat.last}" class="fw-normal"> </span>
                </span>
            </span>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn-logout" type="submit">Logout</button>
        </form>
    </div>
</nav>

<div class="d-flex">
    <div class="bg-white text-blue" style="width: 260px; min-height: 100vh; margin-top: 16px">
        <div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link btn btn-primary active text-white text-start" href="/admin">
                        Admin
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-primary bg-white text-blue text-start " href="/user">
                        User
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="flex-grow-1 p-4 bg-light">

        <h1 style="margin-left: 20px">Admin panel</h1>

        <ul class="nav" style="margin-left: 20px">
            <li class="nav-item">
                <a href="/admin" class="nav-link btn btn-outline-secondary-white">Users table</a>
            </li>
            <li class="nav-item">
                <a href="/admin/new" class="nav-link btn btn-outline-secondary-white active border" aria-current="page">New
                    User</a>
            </li>
        </ul>

        <div class="bg-light border p-2 rounded-top" style="padding-left: 20px !important; padding-right: 20px !important; margin-left: 20px; margin-right: 20px">
            <h5>Add new user</h5>
        </div>
        <div class="form-container d-flex justify-content-center align-items-center rounded-bottom" style="border: 1px solid #dee2e6; margin-left: 20px; margin-right: 20px">
            <div class="card-body w-100 bg-white text-center">
        <form th:method="POST" th:action="@{/admin/new}" th:object="${newuser}">
            <div>
            <label class="form-label d-block fw-bold mb-0" style="padding-top: 15px">First name </label>
            <input type="text" th:field="*{name}" id="name" placeholder="First name" style="width: 350px; height: 30px; padding-left: 5px" class="form-control mx-auto">
            </div>

            <div>
            <label class="form-label d-block fw-bold mb-0" style="padding-top: 15px">Last name </label>
            <input type="text" th:field="*{lastName}" id="lastname" placeholder="Last name" style="width: 350px; height: 30px; padding-left: 5px" class="form-control mx-auto">
            </div>

            <div>
                <label class="form-label d-block fw-bold mb-0" style="padding-top: 15px">Age </label>
                <input type="text" th:field="*{age}" id="age"  placeholder="Age" style="width: 350px; height: 30px; padding-left: 5px" class="form-control mx-auto">
            </div>

            <div>
            <label class="form-label d-block fw-bold mb-0" style="padding-top: 15px">Email </label>
            <input type="email" th:field="*{username}" id="username" placeholder="Email" style="width: 350px; height: 30px; padding-left: 5px" class="form-control mx-auto" required>
            </div>

            <div>
            <label class="form-label d-block fw-bold mb-0" style="padding-top: 15px">Password </label>
            <input type="password" th:field="*{password}" id="password" placeholder="Password" style="width: 350px; height: 30px; padding-left: 5px" class="form-control mx-auto" required>
            </div>

            <div>
            <label class="form-label d-block fw-bold mb-0" style="padding-top: 15px">Role </label>
            <select name="rolename" multiple style="width: 350px; height: 45px; padding-left: 5px" class="form-control mx-auto">
                <option th:each="role : ${allRoles}"
                        th:value="${role.name}"
                        th:text="${role.name.replace('ROLE_', '')}">
                </option>
            </select>
            </div>
            <input type="submit" class="btn btn-primary bg-success text-white special-add-btn" style="margin-top: 10px; margin-bottom: 20px; width: 200px; height: 35px; border: none" value="Add new user"/>
        </form>
        </div>
        </div>
    </div>
</div>
</body>
</html>
