<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <meta charset="UTF-8">
    <title>User page</title>

    <style>
        .btn-logout {
            background-color: #212529;
            color: #6c757d;
            border: none;
        }
            .btn-logout:hover {
                color: white;
                background-color: #212529;
            }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <span th:text="${user.username}" class="fw-bold"></span>
                <span class="fw-normal">with roles:</span>
                 <span th:each="role, iterStat : ${user.roles}">
                    <span th:text="${role.name.replace('ROLE_','')}" class="fw-normal"></span>
                    <span th:if="${!iterStat.last}" class="fw-normal"> </span>
                </span>
            </span>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn-logout" type="submit">Logout</button>
        </form>
    </div>
</nav>

<div class="d-flex">
    <div class="bg-white text-blue" style="width: 260px; min-height: 100vh; margin-top: 16px">
        <div>
            <ul class="nav flex-column">
                <li class="nav-item" th:if="${isAdmin}">
                    <a class="nav-link btn btn-primary bg-white text-blue text-start" href="/admin">
                        Admin
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-primary  active text-white text-start " href="/user">
                        User
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="flex-grow-1 p-4 bg-light">
        <h1 style="margin-left: 20px">User information-page</h1>
        <div class="bg-light border p-2 rounded-top" style="padding-left: 20px !important; padding-right: 20px !important; margin-left: 20px; margin-right: 20px">
            <h5>About user</h5>
        </div>
        <div class="bg-white rounded-bottom" style="border: 1px solid #dee2e6; padding-left: 20px; padding-right: 20px; padding-bottom: 20px; padding-top: 20px; margin-left: 20px; margin-right: 20px">
        <table class="table table-borderless">
            <thead>
            <tr class="border-top">
                <th scope="col" style="width: 5%">ID</th>
                <th scope="col" style="width: 10%">First Name</th>
                <th scope="col" style="width: 10%">Last Name</th>
                <th scope="col" style="width: 5%">Age</th>
                <th scope="col" style="width: 15%;">Email</th>
                <th scope="col" style="width: 15%">Role</th>
            </tr>
            </thead>
            <tbody id="userBody">

            </tbody>
        </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>

   let allRoles = [];

   function loadRoles() {
       fetch('/api/roles')
           .then(response => response.json())
           .then(roles => {
               allRoles = roles;
               $('select[name="rolename"]').each(function() {
                   const $select = $(this);
                   $select.empty();
                   roles.forEach(role => {
                        $select.append(`<option value="${role.name}">${role.name.replace('ROLE_', '')}</option>`);
                   });
               });
           });
   }

   function loadUser() {
       fetch('/api/user')
           .then(response => response.json())
           .then(user => {
               const $tbody = $('#userBody');
               $tbody.empty();
               const roles = user.roles.map(r => r.name.replace('ROLE_', '')).join(', ');
               $tbody.append(`
                   <tr class="table-secondary border-top">
                       <td>${user.id}</td>
                       <td>${user.name}</td>
                       <td>${user.lastName}</td>
                       <td>${user.age}</td>
                       <td>${user.username}</td>
                       <td>${roles}</td>
                   </tr>
               `);
           });
   }

   $(document).ready(function() {
   loadRoles();
   loadUser();
});

</script>
</body>
</html>
