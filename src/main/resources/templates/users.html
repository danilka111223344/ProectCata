<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<table class="table table-dark">
    <thead>
    <tr>
        <th scope="col">Id</th>
        <th scope="col">Name</th>
        <th scope="col">Lastname</th>
        <th scope="col">Email</th>
        <th scope="col">Age</th>
        <th scope="col">Phonenumber</th>
        <th scope="col">DeleteUser</th>
        <th scope="col">UpdateUser</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user: ${requestusers}">
        <td th:text="${user.id}"/>
        <td th:text="${user.name}"/>
        <td th:text="${user.lastName}"/>
        <td th:text="${user.email}"/>
        <td th:text="${user.age}"/>
        <td th:text="${user.phonenumber}"/>
        <td>
            <form th:method="POST" th:action="@{/users/delete}"  >
                <input type="hidden" name="id" th:value="${user.id}">
                <input type="submit" value="Delete">
            </form>
        </td>
        <td>
            <a th:href="@{/users/change(id=${user.id})}">Update user information</a>
        </td>
    </tr>
    </tbody>
</table>
<br/>
<a th:href="@{/users/new}">Create new user</a>
</body>
</html>
