<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <meta charset="UTF-8">
    <title>Login page</title>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card" style="border: none">
                <div class="card" style="border: none">
                    <div class="card-header bg-white pb-0" style="border: none">
                        <h3 class="m-0 p-0 fw-bold">Please sign in</h3>
                    </div>
                    <div class="card-body m-o">
                        <form th:action="@{/login}" method="post">
                            <div>
                                <input type="email" name="username" class="form-control w-75" style="height: 35px" placeholder="Email address"
                                       required>
                            </div>
                            <div class="mb-2">
                                <input type="password" name="password" class="form-control w-75" style="height: 35px" placeholder="Password"
                                       required>
                            </div>
                            <div th:if="${param.error}" class="alert alert-danger w-75">
                                Invalid username or password
                            </div>
                            <button type="submit" class="btn btn-primary w-75" style="height: 45px">Sign in</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
